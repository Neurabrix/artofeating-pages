name: HTTPS uptime monitor

on:
  schedule:
    # Run away from the top of the hour, when scheduled Actions are busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: shinysurendran-https-uptime
  cancel-in-progress: true

jobs:
  monitor:
    name: Check public website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISSUE_LABEL: uptime-monitor
      ISSUE_TITLE: "[Uptime] shinysurendran.com HTTPS check failing"

    steps:
      - name: Check HTTPS, redirect, content, and certificates
        shell: bash
        run: |
          set -euo pipefail

          monitor_tmp="$(mktemp -d)"
          trap 'rm -rf "$monitor_tmp"' EXIT

          check_https() {
            local url="$1"
            local output_file="$2"
            local result status final_url

            result="$(curl --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --output "$output_file" \
              --write-out '%{http_code} %{url_effective} %{remote_ip} %{time_total}' \
              "$url")"

            read -r status final_url remote_ip total_time <<<"$result"
            printf '%s -> status=%s final_url=%s remote_ip=%s time_total=%ss\n' \
              "$url" "$status" "$final_url" "$remote_ip" "$total_time"

            [[ "$status" == "200" ]]
            [[ "$final_url" == https://* ]]
            grep -Eiq 'Art[[:space:]]+of[[:space:]]+Eating' "$output_file"
          }

          check_certificate() {
            local host="$1"
            printf 'Checking certificate chain and 14-day validity for %s\n' "$host"
            timeout 20 openssl s_client \
              -connect "$host:443" \
              -servername "$host" \
              -verify_return_error \
              -verify_hostname "$host" \
              </dev/null 2>/dev/null \
              | openssl x509 -checkend 1209600 -noout
          }

          check_https "https://shinysurendran.com/" "$monitor_tmp/apex.html"
          check_https "https://www.shinysurendran.com/" "$monitor_tmp/www.html"
          check_https "http://shinysurendran.com/" "$monitor_tmp/http-redirect.html"

          check_certificate "shinysurendran.com"
          check_certificate "www.shinysurendran.com"

      - name: Open or update the outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
            -f name="$ISSUE_LABEL" \
            -f color="d73a4a" \
            -f description="Automated public website availability alert" \
            >/dev/null 2>&1 || true

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$ISSUE_LABEL" \
            --search "$ISSUE_TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The HTTPS monitor is still failing. [View this run]($run_url)."
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --assignee "Neurabrix" \
              --body "The external HTTPS monitor detected a failure. It checks the apex and www hosts, the HTTP-to-HTTPS redirect, expected page content, hostname verification, and at least 14 days of certificate validity. [View the failed run]($run_url)."
          fi

      - name: Close the outage issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$ISSUE_LABEL" \
            --search "$ISSUE_TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The HTTPS monitor has recovered. [View the successful run]($run_url)."
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi
